name: Build SKYLINE property tutorial
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/build_property_tutorial.py'
      - '.github/workflows/build-property-tutorial.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak ffmpeg
          python -m pip install --upgrade pip
          python -m pip install pillow numpy opencv-python-headless
      - name: Render tutorial
        run: python tools/build_property_tutorial.py
      - name: Commit rendered MP4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skyline-free-property-ad-tutorial.mp4
          git diff --cached --quiet || git commit -m "Add free property ad tutorial video"
          git push
